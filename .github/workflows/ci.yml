name: Liyuid Production CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: garapadev/postgres-postgis-pgvector:16
        env:
          POSTGRES_USER: liyuid_admin
          POSTGRES_PASSWORD: liyuid_password
          POSTGRES_DB: liyuid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liyuid_admin -d liyuid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pyotp

    - name: Validate Alembic Migrations
      env:
        DATABASE_URL: postgresql+psycopg://liyuid_admin:liyuid_password@localhost:5432/liyuid_test
        PYTHONPATH: liyuid-backend:.
      run: |
        cd liyuid-backend
        alembic upgrade head

    - name: Run Pytest Test Suite
      env:
        DATABASE_URL: postgresql+psycopg://liyuid_admin:liyuid_password@localhost:5432/liyuid_test
        TEST_DATABASE_URL: postgresql+psycopg://liyuid_admin:liyuid_password@localhost:5432/liyuid_test
        PYTHONPATH: liyuid-backend:.
        SECRET_KEY: test_ci_secret_key_liyuid
        AES_GCM_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      run: |
        python -m pytest liyuid-backend/tests/ -v

  frontend-check:
    name: Frontend TypeScript & Lint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      working-directory: liyuid-frontend
      run: npm install --legacy-peer-deps

    - name: Typecheck Frontend
      working-directory: liyuid-frontend
      run: npx tsc --noEmit
